name: Nightly Phase 2U Quality Matrix

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-real-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix quality-lab
      - run: npx --prefix quality-lab playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: git diff --check
      - run: npm run diagnostic:mature
      - run: npm run lab:no-fallback-probe
      - name: Extended fixtures, objectives, method matrix, viewports, frames, and soak
        run: npm run lab:nightly
      - run: npm run diagnostic:phase2t
      - run: npm run diagnostic:phase2u
      - name: Upload nightly traces, video, screenshots, frames, and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase2u-nightly-quality-lab
          path: |
            quality-lab/artifacts/
            quality-lab/reports/
          if-no-files-found: error

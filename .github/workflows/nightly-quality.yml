name: Manual Extended Quality Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-real-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix quality-lab
      - run: npx --prefix quality-lab playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm run lab:typecheck
      - run: git diff --check
      - run: npm run lab:no-fallback-probe
      - name: Explicit extended fixtures, Research proof, viewport matrix, fuzz, and soak
        run: npm run lab:extended
      - name: Upload extended traces, video, screenshots, frames, and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-quality-lab
          path: |
            quality-lab/artifacts/
            quality-lab/reports/
          if-no-files-found: error

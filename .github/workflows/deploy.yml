name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest without piling up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix quality-lab
      - run: npx --prefix quality-lab playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: git diff --check
      - run: npm run diagnostic:mature
      - run: npm run lab:no-fallback-probe
      - name: Phase 2T release and Phase 2U interaction matrix
        run: npm run lab:release
      - run: npm run diagnostic:phase2t
      - run: npm run diagnostic:phase2u
      - name: Upload real-browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase2u-quality-lab
          path: |
            quality-lab/artifacts/
            quality-lab/reports/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
